<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Atana IM Tasks</title>
<style>
  body{font-family:system-ui,sans-serif;background:#1e1b4b;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .box{text-align:center;padding:24px;}
  a{color:#c4b5fd;font-weight:700;}
</style>
</head>
<body>
<div class="box">
  <p>Opening Atana IM Tasks v3.40.14…</p>
  <p><a id="go" href="app.html?v=3414">Open app</a></p>
</div>
<script>
(async function () {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  const url = "app.html?v=3414&t=" + Date.now();
  document.getElementById("go").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
